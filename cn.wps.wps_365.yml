id: cn.wps.wps_365
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# base: org.electronjs.Electron2.BaseApp
# base-version: '25.08'
tags:
  - proprietary
command: wps
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --env=TMPDIR=/var/tmp
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-public-share
  - --filesystem=xdg-videos
  - --filesystem=xdg-templates
  - --filesystem=/run/media
  - --filesystem=/media

cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/pkgconfig
  - /lib/cmake
modules:
  - shared-modules/glu/glu-9.json

  - name: wps
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh ${FLATPAK_DEST}/bin/apply_extra
      # - install -Dm755 xiezuo.sh ${FLATPAK_DEST}/bin/xiezuo
      - install -Dm755 wps_runner.sh ${FLATPAK_DEST}/bin/wps_runner
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 ${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 ${FLATPAK_ID}.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps
      - install -Dm755 /usr/bin/desktop-file-edit -t ${FLATPAK_DEST}/bin/
      - for appbin in et  misc  wpp  wps  wpspdf; do ln -s ${FLATPAK_DEST}/bin/wps_runner
        ${FLATPAK_DEST}/bin/$appbin; done
    sources:
      - type: file
        path: apply_extra.sh

      # - type: script
      #   dest-filename: xiezuo.sh
      #   commands:
      #     - zypak-wrapper /app/extra/opt/xiezuo/xiezuo "$@"

      - type: file
        path: wps_runner.sh

      - type: file
        path: cn.wps.wps_365.metainfo.xml

      - type: file
        path: cn.wps.wps_365.desktop

      - type: file
        path: cn.wps.wps_365.svg

      - type: extra-data
        filename: wps-office.deb
        only-arches:
          - x86_64
        url: https://pubwps-wps365-obs.wpscdn.cn/download/Linux/26885/wps-office_12.1.2.26885.AK.preread.sw.365_715978_amd64.deb
        sha256: bd19a415d1b8ebb61e7d8b37fd067ed3e0fadddfad556a5f405e341750c14005
        size: 907776360
        x-checker-data:
          type: json
          url: https://plus.wps.cn/ops/opsd/api/v1/policy?window_key=wps365_download_pc_muti
          version-query: .data[] | select(.key=="downloadcontent") | .value | fromjson
            | .[] | select(.downloadtype=="linuxintegrate") | .links[] | select(.arch=="X64")
            | .packageList[] | select(.type=="deb") | .link | capture("/wps-office_(?<v>\\d+\\.\\d+\\.\\d+\\.\\d+)\\.[^_]+_(?<build>\\d+)_amd64\\.deb$")
            | "\(.v)_\(.build)"
