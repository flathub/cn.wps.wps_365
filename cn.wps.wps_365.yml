            | .[] | select(.downloadtype=="linuxintegrate") | .links[] | select(.arch=="X64")
            | .packageList[] | select(.type=="deb") | .link

      - type: extra-data
        filename: wps-office.deb
        only-arches:
          - aarch64
        url: https://pubwps-wps365-obs.wpscdn.cn/download/Linux/26885/wps-office_12.1.2.26885.AK.preread.sw.365_715982_arm64.deb
        sha256: 305ddb6db7c91ffa5b6b29fb271172e817b0e37b941fa011fbab8a73a828f495
        size: 863660836
        x-checker-data:
          type: json
          url: https://plus.wps.cn/ops/opsd/api/v1/policy?window_key=wps365_download_pc_muti
          version-query: .data[] | select(.key=="downloadcontent") | .value | fromjson
            | .[] | select(.downloadtype=="linuxintegrate") | .links[] | select(.arch=="ARM64")
            | .packageList[] | select(.type=="deb") | .link | capture("/wps-office_(?<v>\\d+\\.\\d+\\.\\d+\\.\\d+)\\.[^_]+_(?<build>\\d+)_arm64\\.deb$")
            | "\(.v)_\(.build)"
          url-query: .data[] | select(.key=="downloadcontent") | .value | fromjson
